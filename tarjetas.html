    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-image: url("aurora.png");
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white;
        }
        :root { --color-barra: #000000d6; }
        .navbar-custom { background-color: var(--color-barra) !important; }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand { color: white !important; }
        .dropdown-menu { background-color: rgba(0, 0, 0, 0.9); border: 1px solid #b6097f; }
        .dropdown-item { color: #ffffff !important; }
        .dropdown-item:hover { background-color: #b6097f !important; }

        .card-custom {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            border: 2px solid #b6097f;
            color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card-custom:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px #b6097f;
        }
        .card-img-top {
            height: 250px;
            object-fit: cover;
        }
        .text-accent {
            color: #ff00b3;
            font-weight: bold;
        }
    </style>
</head>

               <li><a class="dropdown-item" href="personajes1.html">Personajes 1</a></li>

<div class="container my-5">
    <h1 class="text-center mb-5" style="text-shadow: 2px 2px 5px black;">Galería de Personajes </h1>
    <div class="row g-4" id="contenedorTarjetas"></div>
</div>
<script>

const datos = localStorage.getItem("personajes");
const contenedor = document.getElementById("contenedorTarjetas");

if(datos){

    const personajes = JSON.parse(datos);

    personajes.forEach(p => {

        contenedor.innerHTML += `

        <div class="col-md-4 mb-4">

            <div class="card card-custom h-100">

                <img src="${p.foto_perfil}"
                     class="card-img-top"
                     alt="${p.nombre_personaje}">

                <div class="card-body">

                    <h3 class="text-accent">
                        ${p.nombre_personaje}
                    </h3>

                    <p>
                        <strong>Serie:</strong>
                        ${p.nombre_serie}
                    </p>

                    <p>
                        <strong>Actriz:</strong>
                        ${p.actriz}
                    </p>

                    <p>
                        <strong>Habilidad:</strong>
                        ${p.habilidad_destacada}
                    </p>

                    <p>
                        <strong>Altura:</strong>
                        ${p.altura}
                    </p>

                    <p>
                        <strong>Ocupación:</strong>
                        ${p.ocupacion}
                    </p>

                    <p>
                        <strong>Biografía:</strong><br>
                        ${p.bio}
                    </p>

                </div>

            </div>

        </div>

        `;

    });

}else{

    contenedor.innerHTML =
    "<h3 class='text-center'>No hay personajes registrados</h3>";

}

</script>
</body>

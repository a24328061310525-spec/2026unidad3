<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Princesa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-image: url("aurora.png");
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white;
        }
        :root { --color-barra: #000000d6; }
        .navbar-custom { background-color: var(--color-barra) !important; }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand { color: white !important; }
        .dropdown-menu { background-color: rgba(0, 0, 0, 0.9); border: 1px solid #b6097f; }
        .dropdown-item { color: #ffffff !important; }
        .dropdown-item:hover { background-color: #b6097f !important; }
        
        .form-container {
            background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            border: 2px solid #b6097f; border-radius: 15px; padding: 30px; margin-top: 30px;
        }
        .btn-custom { background-color: #b6097f; color: white; font-weight: bold; border: none; }
        .btn-custom:hover { background-color: #8c0561; color: white; }
        label { font-weight: bold; color: #b6097f; margin-top: 10px; }
        .form-control, .form-select { background-color: rgba(255, 255, 255, 0.1); color: white; border: 1px solid #b6097f; }
        .form-control:focus, .form-select:focus { background-color: rgba(0, 0, 0, 0.8); color: white; border-color: #ff00b3; box-shadow: 0 0 8px rgba(182, 9, 127, 0.6); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="index1.html">Home</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Unidad 1</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="meterdatos.html">Meter Datos</a></li>
                        <li><a class="dropdown-item" href="tablafinal.html">Tabla Final</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 form-container">
            <h2 class="text-center mb-4">Registrar Nueva Princesa / Personaje</h2>
            <form id="formPrincesa">
                <div class="row">
                    <div class="col-md-6">
                        <label for="personaje">Nombre de Princesa / Personaje</label>
                        <input type="text" class="form-control" id="personaje" required placeholder="Ej. Bella Durmiente">
                    </div>
                    <div class="col-md-6">
                        <label for="nombrereal">Nombre Real</label>
                        <input type="text" class="form-control" id="nombrereal" required placeholder="Ej. Aurora">
                    </div>
                    <div class="col-md-4">
                        <label for="altura">Altura (cm)</label>
                        <input type="number" class="form-control" id="altura" required placeholder="Ej. 168">
                    </div>
                    <div class="col-md-4">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" class="form-control" id="peso" required placeholder="Ej. 55">
                    </div>
                    <div class="col-md-4">
                        <label for="sexo">Sexo</label>
                        <input type="text" class="form-control" id="sexo" required placeholder="Ej. Femenino">
                    </div>
                    <div class="col-md-6">
                        <label for="poderes">Poderes / Virtudes</label>
                        <input type="text" class="form-control" id="poderes" required placeholder="Ej. Gracia y encanto">
                    </div>
                    <div class="col-md-6">
                        <label for="debilidad">Debilidad</label>
                        <input type="text" class="form-control" id="debilidad" required placeholder="Ej. Maldición del sueño">
                    </div>
                    <div class="col-md-4">
                        <label for="creaton">Fecha de Creación</label>
                        <input type="date" class="form-control" id="creaton" required>
                    </div>
                    <div class="col-md-8">
                        <label for="imagen">Nombre de la Imagen (de tu carpeta)</label>
                        <input type="text" class="form-control" id="imagen" placeholder="Ej. aurora1.jpg">
                    </div>
                    <div class="col-12">
                        <label for="biografia">Biografía / Historia</label>
                        <textarea class="form-control" id="biografia" rows="3" required placeholder="Escribe la historia aquí..."></textarea>
                    </div>
                    <div class="col-12 text-center mt-4">
                        <button type="submit" class="btn btn-custom px-5">Guardar Princesa</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Aquí extraemos exactamente los datos iniciales que tienes en tu archivo SQL
const princesasIniciales = [
    { id: 2, nombrereal: "Aurora", personaje: "Bella Durmiente", altura: 168, peso: 55, poderes: "Gracia y encanto", sexo: "Femenino", debilidad: "Maldición del sueño", creaton: "1959-01-29", biografia: "Princesa maldecida por un hada oscura a dormir profundamente hasta recibir el beso de amor verdadero.", imagen: "aurora1.jpg" },
    { id: 3, nombrereal: "Cenicienta", personaje: "Cinderella", altura: 165, peso: 55, poderes: "Esperanza y resiliencia", sexo: "Femenino", debilidad: "Exceso de bondad", creaton: "1950-02-15", biografia: "Joven maltratada por su madrastra que, con ayuda mágica, asiste al baile real y cambia su destino.", imagen: "Cenicienta.jpg" },
    { id: 5, nombrereal: "Ariel", personaje: "La Sirenita", altura: 165, peso: 55, poderes: "Respirar bajo el agua", sexo: "Femenino", debilidad: "Curiosidad extrema", creaton: "1989-11-17", biografia: "Sirena soñadora que anhela vivir en el mundo humano y desafía las reglas por amor y libertad.", imagen: "ariel.jpg" },
    { id: 6, nombrereal: "Bella", personaje: "Belle", altura: 168, peso: 58, poderes: "Inteligencia y empatía", sexo: "Femenino", debilidad: "Sacrificio personal", creaton: "1991-11-22", biografia: "Joven amante de los libros que ve más allá de las apariencias y ayuda a romper un hechizo", imagen: "bella.jpg" },
    { id: 7, nombrereal: "Mulan", personaje: "Fa Mulan", altura: 168, peso: 57, poderes: "Estrategia y combate", sexo: "Femenino", debilidad: "Presión social", creaton: "1998-06-19", biografia: "Joven valiente que se hace pasar por hombre para proteger a su padre y salvar a su nación.", imagen: "Mulan.jpg" },
    { id: 35, nombrereal: "Elsa", personaje: "Reina de hielo", altura: 165, peso: 56, poderes: "Control del hielo y la nieve", sexo: "Femenino", debilidad: "Miedo a sus poderes", creaton: "2013-11-27", biografia: "Reina con poderes de hielo que aprende a aceptarse.", imagen: "Elsa.jpg" }
];

// Si el navegador no tiene guardado nada, le inyectamos los datos del SQL
if (!localStorage.getItem("misPrincesas")) {
    localStorage.setItem("misPrincesas", JSON.stringify(princesasIniciales));
}

document.getElementById("formPrincesa").addEventListener("submit", function(e) {
    e.preventDefault();
    
    let listaActual = JSON.parse(localStorage.getItem("misPrincesas"));
    
    // Generar nuevo ID dinámico
    let nuevoId = listaActual.length > 0 ? Math.max(...listaActual.map(p => p.id)) + 1 : 1;
    
    const nuevaPrincesa = {
        id: nuevoId,
        nombrereal: document.getElementById("nombrereal").value,
        personaje: document.getElementById("personaje").value,
        altura: document.getElementById("altura").value,
        peso: document.getElementById("peso").value,
        poderes: document.getElementById("poderes").value,
        sexo: document.getElementById("sexo").value,
        debilidad: document.getElementById("debilidad").value,
        creaton: document.getElementById("creaton").value,
        biografia: document.getElementById("biografia").value,
        imagen: document.getElementById("imagen").value || "blanca.jpg"
    };
    
    listaActual.push(nuevaPrincesa);
    localStorage.setItem("misPrincesas", JSON.stringify(listaActual));
    
    alert("¡Princesa guardada exitosamente en el navegador!");
    document.getElementById("formPrincesa").reset();
});
</script>
</body>
</html>

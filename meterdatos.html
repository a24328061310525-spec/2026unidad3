<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 form-container">
            <h2 class="text-center mb-4" style="text-shadow: 2px 2px 5px black;">Registrar Nuevo Personaje</h2>
            
            <form id="formularioPersonaje">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="personaje" class="form-label">Nombre del Personaje</label>
                        <input type="text" class="form-control" id="personaje" required placeholder="Ej. Batman">
                    </div>
                    <div class="col-md-6">
                        <label for="nombrereal" class="form-label">Nombre Real</label>
                        <input type="text" class="form-control" id="nombrereal" required placeholder="Ej. Bruce Wayne">
                    </div>
                    <div class="col-md-4">
                        <label for="altura" class="form-label">Altura</label>
                        <input type="text" class="form-control" id="altura" placeholder="Ej. 1.88 m">
                    </div>
                    <div class="col-md-4">
                        <label for="peso" class="form-label">Peso</label>
                        <input type="text" class="form-control" id="peso" placeholder="Ej. 95 kg">
                    </div>
                    <div class="col-md-4">
                        <label for="sexo" class="form-label">Sexo</label>
                        <select class="form-select" id="sexo">
                            <option value="Masculino">Masculino</option>
                            <option value="Femenino">Femenino</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="poderes" class="form-label">Poderes / Habilidades</label>
                        <input type="text" class="form-control" id="poderes" placeholder="Ej. Intelecto genio, combate">
                    </div>
                    <div class="col-md-6">
                        <label for="debilidad" class="form-label">Debilidad</label>
                        <input type="text" class="form-control" id="debilidad" placeholder="Ej. Recordar a sus padres">
                    </div>
                    <div class="col-md-4">
                        <label for="creacion" class="form-label">Año de Creación</label>
                        <input type="text" class="form-control" id="creacion" placeholder="Ej. 1939">
                    </div>
                    <div class="col-md-8">
                        <label for="imagen" class="form-label">Ruta de la Imagen / URL</label>
                        <input type="text" class="form-control" id="imagen" placeholder="Ej. imagenes/batman.jpg">
                    </div>
                    <div class="col-12">
                        <label for="biografia" class="form-label">Biografía corta</label>
                        <textarea class="form-control" id="biografia" rows="3" placeholder="Breve historia del personaje..."></textarea>
                    </div>
                    <div class="col-12 text-center mt-4">
                        <button type="submit" class="btn btn-custom px-5 py-2">Guardar Personaje</button>
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Arreglo de base por si el LocalStorage está totalmente vacío
const personajesPorDefecto = [
    {
        id: 1,
        nombrereal: "Tom Holland",
        personaje: "Spider-Man",
        altura: "1.73 m",
        peso: "76 kg",
        poderes: "Sentido arácnido",
        sexo: "Masculino",
        debilidad: "Sonidos fuertes",
        creacion: "1962",
        biografia: "Héroe de Marvel",
        imagen: "imagenes/spiderman.jpg"
    },
    {
        id: 2,
        nombrereal: "Robert Downey Jr.",
        personaje: "Iron Man",
        altura: "1.74 m",
        peso: "78 kg",
        poderes: "Armadura tecnológica",
        sexo: "Masculino",
        debilidad: "Dependencia tecnológica",
        creacion: "1963",
        biografia: "Genio multimillonario",
        imagen: "imagenes/iroman.webp"
    }
];

// Al cargar el archivo, extraemos lo que ya esté guardado; si no hay nada, tomamos el arreglo base
let datosGuardados = localStorage.getItem("misPersonajes");
let personajes = datosGuardados ? JSON.parse(datosGuardados) : personajesPorDefecto;

// Escuchamos el evento de envío del formulario
document.getElementById("formularioPersonaje").addEventListener("submit", function(event) {
    event.preventDefault(); // Evita que la página se recargue automáticamente

    // Construimos el nuevo objeto dinámico con los IDs de los inputs
    const nuevoPersonaje = {
        id: personajes.length + 1,
        nombrereal: document.getElementById("nombrereal").value,
        personaje: document.getElementById("personaje").value,
        altura: document.getElementById("altura").value || "N/A",
        peso: document.getElementById("peso").value || "N/A",
        poderes: document.getElementById("poderes").value || "Ninguno",
        sexo: document.getElementById("sexo").value,
        debilidad: document.getElementById("debilidad").value || "Ninguna",
        creacion: document.getElementById("creacion").value || "N/A",
        biografia: document.getElementById("biografia").value || "Sin descripción.",
        imagen: document.getElementById("imagen").value || "imagenes/spiderman.jpg" // Imagen por defecto si se deja vacío
    };

    // Agregamos el personaje nuevo al arreglo en memoria de esta página
    personajes.push(nuevoPersonaje);

    // 🔥 LA CLAVE DE TODO: Reescribimos la memoria compartida del navegador
    localStorage.setItem("misPersonajes", JSON.stringify(personajes));

    alert("¡Personaje guardado con éxito! Revisa la galería o las tablas.");
    
    // Reseteamos visualmente los campos del formulario
    document.getElementById("formularioPersonaje").reset();
});
</script>

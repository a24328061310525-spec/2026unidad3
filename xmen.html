input,
textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:var(--color-input);
    color:white;
}

input:focus,
textarea:focus{
    outline:none;
    box-shadow:0 0 10px var(--color-acento);
}

textarea{
    min-height:120px;
    resize:vertical;
}

.btn-guardar{
    background:linear-gradient(45deg,#ff4fc4,#8d4fff);
    color:white;
    border:none;
    padding:12px 35px;
    border-radius:30px;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

.btn-guardar:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #ff4fc4;
}

#mensaje{
    margin-top:20px;
    text-align:center;
    font-size:18px;
    color:#7dff8a;

<div class="container-form">

<h1> Registrar Personaje</h1>

<form id="formPersonaje">

<div class="form-group">
<label for="nombre">Personaje de Serie</label>
<input type="text" id="nombre" placeholder="Ej. Daenerys Targaryen" required>
</div>

<div class="form-group">
<label for="serie">Serie a la que pertenece</label>
<input type="text" id="serie" placeholder="Ej. Game of Thrones" required>
</div>

<div class="form-group">
<label for="nombrereal">Nombre de la Actriz</label>
<input type="text" id="nombrereal" placeholder="Ej. Emilia Clarke" required>
</div>

<div class="form-group">
<label for="poderes">Habilidad Destacada</label>
<input type="text" id="poderes" placeholder="Ej. Estrategia, Liderazgo" required>
</div>

<div class="form-group">
<label for="altura">Altura</label>
<input type="text" id="altura" placeholder="Ej. 1.75 m" required>
</div>

<div class="form-group">
<label for="ocupacion">Ocupación</label>
<input type="text" id="ocupacion" placeholder="Ej. Reina / Espía" required>
</div>

<div class="form-group">
<label for="bio">Biografía</label>
<textarea id="bio" placeholder="Escribe la historia del personaje..."></textarea>
</div>

<div class="form-group">
<label for="imagen">Foto del Personaje</label>
<input type="file" id="imagen" accept="image/*">
</div>

<div style="text-align:center;">
<button type="submit" class="btn-guardar">
Guardar Personaje
</button>
</div>

</form>

<div id="mensaje"></div>

</div>

<script>

document.getElementById("formPersonaje").addEventListener("submit", function(e){

e.preventDefault();

const personaje = {

nombre_personaje: document.getElementById("nombre").value,
nombre_serie: document.getElementById("serie").value,
actriz: document.getElementById("nombrereal").value,
habilidad_destacada: document.getElementById("poderes").value,
altura: document.getElementById("altura").value,
ocupacion: document.getElementById("ocupacion").value,
bio: document.getElementById("bio").value,
foto_perfil: "imagenes/sin-foto.jpg"

};

let personajes =
JSON.parse(localStorage.getItem("personajes")) || [];

personajes.push(personaje);

localStorage.setItem(
"personajes",
JSON.stringify(personajes)
);

document.getElementById("mensaje").innerHTML =
"✅ Personaje guardado correctamente";

this.reset();

});

</script>
